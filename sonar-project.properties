# Verified against the public SonarQube Cloud project API.
# scripts/sonar-analysis.cjs accepts only these keys, as plain ASCII key=value
# lines, and pins every value except the identifiers and timeout. Change both
# files together. Credentials come only from the SONAR_TOKEN environment.
sonar.organization=soltecsis
sonar.projectKey=soltecsis_fwcloud-websrv
sonar.host.url=https://sonarcloud.io

sonar.sources=src,config
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts,test/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/reports/**,**/.scannerwork/**,**/*.d.ts,**/*.spec.ts,**/*.e2e-spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
