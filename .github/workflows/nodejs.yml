# Documentation: .github/CI-WEBSRV.md
name: FWCloud Websrv CI

on:
  push:
    branches: [main, devel, ENS]
  pull_request:
    branches: [main, devel, ENS]

permissions:
  contents: read

# One active run per pull request (or per branch for pushes). A newer run
# cancels the superseded one; runs for other PRs or branches are unaffected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Reuse FWCloud API's pinned binary and checksum. No npm install or
      # Node.js matrix is needed for this independent security check.
      - name: Load Gitleaks version
        run: |
          node -e '
            const fs = require("node:fs");
            const c = require("./scripts/gitleaks-config.json");
            fs.appendFileSync(process.env.GITHUB_ENV, [
              "GITLEAKS_VERSION=" + c.version,
              "GITLEAKS_ARCHIVE=" + c.archive,
              "GITLEAKS_ARCHIVE_SHA256=" + c.archiveSha256,
              "GITLEAKS_BINARY=" + process.env.RUNNER_TEMP + "/gitleaks",
              ""
            ].join("\n"));
          '

      - name: Install Gitleaks
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}" \
            --output "$RUNNER_TEMP/$GITLEAKS_ARCHIVE"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$RUNNER_TEMP/$GITLEAKS_ARCHIVE" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$GITLEAKS_ARCHIVE" -C "$RUNNER_TEMP" gitleaks

      - name: Verify secret scanning against controlled Git history
        run: node --test scripts/scan-secrets.integration.cjs

      - name: Scan complete Git history and verify ignore-file policy
        id: scan
        run: node scripts/scan-secrets.cjs

      - name: Upload secret scan locations
        if: ${{ !cancelled() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: websrv-secrets-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/secrets/metadata.json
          retention-days: 14
          if-no-files-found: error

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRIVY_CONFIG: /dev/null
      TRIVY_IGNOREFILE: /dev/null
      TRIVY_TIMEOUT: 10m
      TRIVY_DISABLE_TELEMETRY: 'true'
      TRIVY_SKIP_VERSION_CHECK: 'true'
      PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load shared Trivy configuration
        run: |
          node -e '
            const fs = require("node:fs");
            const c = require("./scripts/trivy-config.json");
            fs.appendFileSync(process.env.GITHUB_ENV, [
              "TRIVY_VERSION=" + c.version,
              "TRIVY_ARCHIVE=" + c.archive,
              "TRIVY_ARCHIVE_SHA256=" + c.archiveSha256,
              "TRIVY_BINARY=" + process.env.RUNNER_TEMP + "/trivy",
              "TRIVY_CACHE_DIR=" + process.env.RUNNER_TEMP + "/trivy-cache",
              "TRIVY_BLOCKING_SEVERITIES=" + c.blockingSeverities.join(","),
              "TRIVY_FINDINGS_EXIT_CODE=" + c.findingsExitCode,
              ""
            ].join("\n"));
          '
      - name: Install Trivy
        id: install_trivy
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${TRIVY_ARCHIVE}" \
            --output "$RUNNER_TEMP/$TRIVY_ARCHIVE"
          printf '%s  %s\n' "$TRIVY_ARCHIVE_SHA256" "$RUNNER_TEMP/$TRIVY_ARCHIVE" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$TRIVY_ARCHIVE" -C "$RUNNER_TEMP" trivy
          VERSION=$("$TRIVY_BINARY" --version)
          test "${VERSION%%$'\n'*}" = "Version: $TRIVY_VERSION"
          mkdir -p reports/dependencies
      - name: Verify native Trivy policy
        run: node --test scripts/trivy-policy.test.cjs
      - name: Scan dependency vulnerabilities
        id: trivy
        run: |
          : > reports/dependencies/trivy.json
          set +e
          "$TRIVY_BINARY" fs . --scanners vuln --pkg-types library \
            --include-dev-deps --list-all-pkgs --no-progress \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --ignore-unfixed=false \
            --exit-code 0 --format json --output reports/dependencies/trivy.json \
            2>&1 | tee reports/dependencies/scan.log
          CODES=("${PIPESTATUS[@]}")
          set -e
          echo "exit_code=${CODES[0]}" >> "$GITHUB_OUTPUT"
          test "${CODES[1]}" -eq 0
      - name: Generate CycloneDX SBOM
        id: sbom
        run: |
          : > reports/dependencies/sbom.cdx.json
          set +e
          "$TRIVY_BINARY" fs . --include-dev-deps --no-progress \
            --format cyclonedx --output reports/dependencies/sbom.cdx.json \
            2>&1 | tee reports/dependencies/sbom.log
          CODES=("${PIPESTATUS[@]}")
          set -e
          echo "exit_code=${CODES[0]}" >> "$GITHUB_OUTPUT"
          test "${CODES[1]}" -eq 0
      - name: Record Trivy and database versions
        if: ${{ always() && steps.trivy.outcome != 'skipped' }}
        run: '"$TRIVY_BINARY" version --format json > reports/dependencies/trivy-version.json'
      - name: Enforce Trivy severity policy and report analysis context
        id: trivy_policy
        if: ${{ always() }}
        shell: bash
        env:
          INSTALL_RESULT: ${{ steps.install_trivy.outcome }}
          SCAN_RESULT: ${{ steps.trivy.outcome }}
          TRIVY_EXIT_CODE: ${{ steps.trivy.outputs.exit_code }}
          SBOM_RESULT: ${{ steps.sbom.outcome }}
          TRIVY_SBOM_EXIT_CODE: ${{ steps.sbom.outputs.exit_code }}
        run: |
          mkdir -p reports/dependencies
          GATE_EXIT_CODE=''
          GATE_RESULT=skipped
          GATE_WRITE_CODE=0
          if [ "$INSTALL_RESULT" = success ] && [ "$SCAN_RESULT" != skipped ]; then
            set +e
            "$TRIVY_BINARY" convert --format table --scanners vuln \
              --severity "$TRIVY_BLOCKING_SEVERITIES" --exit-code "$TRIVY_FINDINGS_EXIT_CODE" \
              reports/dependencies/trivy.json 2>&1 | tee reports/dependencies/blocking.txt
            CODES=("${PIPESTATUS[@]}")
            set -e
            GATE_EXIT_CODE=${CODES[0]}
            GATE_WRITE_CODE=${CODES[1]}
            GATE_RESULT=failure
            if [ "$GATE_EXIT_CODE" -eq 0 ] && [ "$GATE_WRITE_CODE" -eq 0 ]; then
              GATE_RESULT=success
            fi
          fi
          echo "exit_code=$GATE_EXIT_CODE" >> "$GITHUB_OUTPUT"
          set +e
          TRIVY_POLICY_EXIT_CODE="$GATE_EXIT_CODE" node scripts/trivy-report.cjs
          SUMMARY_CODE=$?
          set -e
          SUMMARY_RESULT=failure
          if [ "$SUMMARY_CODE" -eq 0 ]; then SUMMARY_RESULT=success; fi
          {
            printf '## Websrv dependency analysis context\n\nSource: %s@%s\n\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf 'Run: %s/%s/actions/runs/%s/attempts/%s\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Trivy installation: %s; configured version: %s\n\n' "$INSTALL_RESULT" "${TRIVY_VERSION:-unavailable}"
            printf 'Scan step: %s; native exit code: %s\n' "$SCAN_RESULT" "${TRIVY_EXIT_CODE:-not run}"
            printf 'SBOM step: %s; native exit code: %s\n' "$SBOM_RESULT" "${TRIVY_SBOM_EXIT_CODE:-not run}"
            printf 'Gate step: %s; native exit code: %s\n' "$GATE_RESULT" "${GATE_EXIT_CODE:-not run}"
            printf 'Evidence validation: %s\n\n' "$SUMMARY_RESULT"
            printf 'Gate codes: 0 = accepted; %s = blocking findings; other nonzero = operational error.\n' "${TRIVY_FINDINGS_EXIT_CODE:-5}"
            printf 'Consult blocking.txt, scan.log, sbom.log and metadata.json when available. Missing reports or skipped steps do not constitute a successful scan.\n'
          } | tee reports/dependencies/context.txt
          cat reports/dependencies/context.txt >> "$GITHUB_STEP_SUMMARY"
          test "$GATE_WRITE_CODE" -eq 0
          test -n "$GATE_EXIT_CODE"
          if [ "$GATE_EXIT_CODE" -ne 0 ]; then exit "$GATE_EXIT_CODE"; fi
          exit "$SUMMARY_CODE"
      - name: Upload dependency security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: websrv-sca-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/dependencies/metadata.json
            reports/dependencies/sbom.cdx.json
            reports/dependencies/trivy.json
            reports/dependencies/trivy-version.json
            reports/dependencies/blocking.txt
            reports/dependencies/context.txt
            reports/dependencies/scan.log
            reports/dependencies/sbom.log
          retention-days: 90
          if-no-files-found: error

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:check

      - name: Run Prettier
        run: npm run format:check

      - name: Test CI report tooling
        run: npm run test:ci-tools

  test:
    name: test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
    env:
      # Node.js 22 is the reference environment for coverage measurements.
      COVERAGE_EXPECTED: ${{ matrix.node-version == '22' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package-lock.json is unchanged
        run: git diff --exit-code -- package-lock.json

      - name: Build FWCloud-Websrv
        run: npm run build

      - name: Run tests
        id: tests
        run: |
          if [ "$COVERAGE_EXPECTED" = true ]; then
            npm run test:coverage:ci
          else
            npm run test:ci
          fi
        env:
          CI: true

      # The steps below also run after failed tests, so the available reports
      # are kept. They are skipped when the tests never started.
      - name: Verify reports and summarize results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: npm run ci:reports
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Upload test reports
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: websrv-tests-node${{ matrix.node-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/jest/
            reports/metadata.json
          if-no-files-found: error

      - name: Upload coverage reports
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' && env.COVERAGE_EXPECTED == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          # One coverage artifact per run. Re-running the reference job replaces
          # it; baseline.json records the run attempt that produced it.
          name: websrv-coverage-node${{ matrix.node-version }}-${{ github.run_id }}
          overwrite: true
          path: |
            coverage/
            reports/coverage/
          if-no-files-found: error

  # Stable required check for branch protection. Add every new required job
  # to `needs`; the gate checks all of them without further changes.
  websrv-ci:
    name: websrv-ci
    if: always()
    needs: [gitleaks, trivy, quality, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check required job results
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null; then
            echo "All required jobs succeeded."
          else
            echo "::error::One or more required jobs did not succeed (failure, skipped or cancelled)."
            exit 1
          fi
